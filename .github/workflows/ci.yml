name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f docs/verification.md
          test -f docs/architecture.md
      - name: No tracked private evidence
        run: |
          if git ls-files | grep -E '(^|/)\.buddy/|\.env$|\.pem$|\.key$'; then
            echo "private evidence tracked" >&2
            exit 1
          fi
      - name: Docs-only repository
        run: echo "No application install or test step: project-sol is a documentation hub."
